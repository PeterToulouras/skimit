name: skimit
description: Says what a pull request did to what your Java service does (routes, jobs and listeners, and the data they write, delete and send) and checks the rules your team set, from the bytecode.
author: Peter Toulouras
branding:
  icon: align-left
  color: red

inputs:
  build:
    description: Command that compiles the project. Default is a quiet compile with Maven, or Gradle when there is no pom.xml.
    required: false
    default: ''
  policy:
    description: Policy file with sinks and rules, relative to the repository root. Without one, data writes through repositories, mappers, DAOs and database clients are the effects, with calls out and messages sent.
    required: false
    default: ''
  version:
    description: skimit release to use, such as 0.2.0, or latest. This version of the Action needs 0.2.0 or later.
    required: false
    default: latest
  fail-on-broken-rule:
    description: Fail the job when the change breaks a rule in the policy, or needs a person under one. Off by default, so the job only reports; a build that fails is reported as a warning, not a failure.
    required: false
    default: 'false'
  comment:
    description: Post the result as a pull request comment, updated on each push. Needs pull-requests write permission.
    required: false
    default: 'false'
  base:
    description: Commit to compare against. Defaults to the base the pull request merges into (the first parent of the merge commit GitHub checks out), or the previous commit on a push.
    required: false
    default: ''
  artifact:
    description: Name of the artifact the page is attached as. Defaults to skimit- and the job's name; set one per job when the action runs in a matrix.
    required: false
    default: ''

outputs:
  broken:
    description: Number of lines where the change breaks a rule or needs a person under one.
    value: ${{ steps.run.outputs.broken }}
  what:
    description: Number of changes to what the program can do (effects gained or lost, ways in added, removed or renamed).
    value: ${{ steps.run.outputs.what }}
  how:
    description: Number of changes to how it does what it already did.
    value: ${{ steps.run.outputs.how }}

runs:
  using: composite
  steps:
    - id: run
      shell: bash
      env:
        SKIMIT_BUILD: ${{ inputs.build }}
        SKIMIT_POLICY: ${{ inputs.policy }}
        SKIMIT_VERSION: ${{ inputs.version }}
        SKIMIT_FAIL: ${{ inputs.fail-on-broken-rule }}
        SKIMIT_COMMENT: ${{ inputs.comment }}
        BASE_INPUT: ${{ inputs.base }}
        PR_BASE: ${{ github.event.pull_request.base.sha }}
        PUSH_BEFORE: ${{ github.event.before }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        GH_TOKEN: ${{ github.token }}
      run: |
        base="$BASE_INPUT"
        if [ -z "$base" ] && [ -n "$PR_BASE" ]; then
          # A pull request is checked out as GitHub's merge of it into the current base. Its first
          # parent is that base, so the comparison is exactly the pull request's own change, even
          # when the base branch has moved on since the pull request was opened.
          parents="$(git cat-file -p HEAD 2>/dev/null | awk '/^parent /{print $2}' || true)"
          if [ "$(echo "$parents" | wc -l)" -eq 2 ]; then base="$(echo "$parents" | head -n 1)"; fi
        fi
        base="${base:-${PR_BASE:-$PUSH_BEFORE}}"
        if [ -z "$base" ] || [ "$base" = 0000000000000000000000000000000000000000 ]; then
          echo "skimit: no base commit to compare against; set the base input" >&2
          exit 0
        fi
        "$GITHUB_ACTION_PATH/action/run.sh" "$base"
    - if: always() && steps.run.outputs.page != ''
      uses: actions/upload-artifact@v7
      with:
        name: ${{ inputs.artifact || format('skimit-{0}', github.job) }}
        overwrite: true
        path: ${{ steps.run.outputs.page }}
        if-no-files-found: ignore
