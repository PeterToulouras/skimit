name: skimit
description: Shows which methods in a pull request need a careful review, worked out from the bytecode, with the call chain that proves each verdict.
author: Peter Toulouras
branding:
  icon: align-left
  color: red

inputs:
  build:
    description: Command that compiles the project. Default is a quiet compile with Maven, or Gradle when there is no pom.xml.
    required: false
    default: ''
  policy:
    description: Policy file naming what is critical, relative to the repository root. Without one, every data write counts as critical.
    required: false
    default: ''
  version:
    description: skimit release to use, such as 0.1.5, or latest.
    required: false
    default: latest
  fail-on-must-review:
    description: Fail the job when anything lands in must review. Off by default, so the job only reports; a build that fails is reported as a warning, not a failure.
    required: false
    default: 'false'
  comment:
    description: Post the manifest as a pull request comment, updated on each push. Needs pull-requests write permission.
    required: false
    default: 'false'
  base:
    description: Commit to compare against. Defaults to the pull request's base, or the previous commit on a push.
    required: false
    default: ''

outputs:
  must-review:
    description: Number of methods that must be reviewed (plus one if what counts as critical changed).
    value: ${{ steps.run.outputs.must-review }}

runs:
  using: composite
  steps:
    - id: run
      shell: bash
      env:
        SKIMIT_BUILD: ${{ inputs.build }}
        SKIMIT_POLICY: ${{ inputs.policy }}
        SKIMIT_VERSION: ${{ inputs.version }}
        SKIMIT_FAIL: ${{ inputs.fail-on-must-review }}
        SKIMIT_COMMENT: ${{ inputs.comment }}
        BASE_INPUT: ${{ inputs.base }}
        PR_BASE: ${{ github.event.pull_request.base.sha }}
        PUSH_BEFORE: ${{ github.event.before }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        GH_TOKEN: ${{ github.token }}
      run: |
        base="${BASE_INPUT:-${PR_BASE:-$PUSH_BEFORE}}"
        if [ -z "$base" ] || [ "$base" = 0000000000000000000000000000000000000000 ]; then
          echo "skimit: no base commit to compare against; set the base input" >&2
          exit 0
        fi
        "$GITHUB_ACTION_PATH/action/run.sh" "$base"
    - if: always() && steps.run.outputs.report != ''
      uses: actions/upload-artifact@v7
      with:
        name: skimit-report
        path: ${{ steps.run.outputs.report }}
        if-no-files-found: ignore
